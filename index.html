<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cartão Ponto — Controle Mensal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'IBM Plex Sans', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .punch-row { display:flex; gap:6px; padding: 10px 20px 0; }
  .punch-hole { width:10px; height:10px; border-radius:50%; box-shadow: inset 0 1px 2px rgba(0,0,0,0.35); }
  .stamp { display:inline-flex; align-items:center; gap:4px; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; letter-spacing:0.04em; padding:3px 8px; border-radius:3px; border:1.5px solid currentColor; transform: rotate(-1.5deg); }
  .card { background:#fff; border:1px solid #C9C1AC; border-radius:6px; }
  .btn-primary { background:#1B2A3D; color:#fff; border:none; border-radius:5px; padding:12px 20px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:8px; font-size:14px; }
  .btn-primary:disabled { opacity:0.6; cursor:default; }
  table.ledger { width:100%; border-collapse:collapse; font-family:'IBM Plex Mono',monospace; font-size:12.5px; }
  table.ledger th { text-align:left; font-family:'IBM Plex Sans',sans-serif; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:#6B6355; padding:6px 8px; border-bottom:1.5px solid #1B2A3D; position: sticky; top:0; background:#fff; }
  table.ledger td { padding:6px 8px; border-bottom:1px solid #C9C1AC; white-space:nowrap; }
  table.ledger tr:nth-child(even) { background: #FAF8F3; }
  .scrollbox { max-height: 360px; overflow-y:auto; border:1px solid #C9C1AC; border-radius:6px; }
  @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  input[type=text], input[type=date], input[type=password] { font-family: 'IBM Plex Sans', sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/plain" id="app-source">
const { useState, useEffect, useRef, useCallback } = React;

// ---------- helpers ----------
const toMin = (hhmm) => {
  if (!hhmm) return 0;
  const parts = String(hhmm).split(":");
  if (parts.length < 2) return 0;
  const h = parseInt(parts[0], 10) || 0;
  const m = parseInt(parts[1], 10) || 0;
  const sign = h < 0 ? -1 : 1;
  return h * 60 + sign * m;
};
const toHHMM = (mins) => {
  const sign = mins < 0 ? "-" : "";
  const abs = Math.abs(Math.round(mins));
  const h = Math.floor(abs / 60);
  const m = abs % 60;
  return `${sign}${h}:${String(m).padStart(2, "0")}`;
};
const calcSaldo = (totais = {}) =>
  toMin(totais.extras70) + toMin(totais.extras100) - toMin(totais.faltas);

const keyFromPeriodo = (periodo) => {
  const clean = (s) => (s || "").replace(/\//g, "-");
  return `cartao:${clean(periodo?.inicio)}_${clean(periodo?.fim)}`;
};
const ajusteKey = (id) => `ajuste:${id}`;
const LS_PREFIX = "cartaoPonto:";
const LS_API_KEY = "cartaoPontoApiKey";

const storage = {
  get(key) {
    const raw = localStorage.getItem(LS_PREFIX + key);
    return raw === null ? null : raw;
  },
  set(key, value) { localStorage.setItem(LS_PREFIX + key, value); },
  delete(key) { localStorage.removeItem(LS_PREFIX + key); },
  list(prefix) {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(LS_PREFIX + prefix)) keys.push(k.slice(LS_PREFIX.length));
    }
    return keys;
  },
};

const fileToBase64 = (file) =>
  new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(",")[1]);
    r.onerror = () => reject(new Error("Falha ao ler arquivo"));
    r.readAsDataURL(file);
  });

const PALETTE = {
  ink: "#1B2A3D", paper: "#EDE8DD", paperDark: "#E0D9C8", line: "#C9C1AC",
  stampRed: "#A63A2C", amber: "#B9822E", teal: "#2F6E64", green: "#3F7D4F",
  textMain: "#26221B", textSub: "#6B6355",
};

function parseBR(dmy) {
  if (!dmy) return 0;
  const [d, m, y] = dmy.split("/").map(Number);
  if (!y) return 0;
  return new Date(y, (m || 1) - 1, d || 1).getTime();
}

// ---------- icons (inline SVG, no external icon library needed) ----------
const Icon = ({ path, size = 16, ...props }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>{path}</svg>
);
const IUpload = (p) => <Icon {...p} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" /></>} />;
const ITrash = (p) => <Icon {...p} path={<><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></>} />;
const IChevronLeft = (p) => <Icon {...p} path={<polyline points="15 18 9 12 15 6" />} />;
const IAlert = (p) => <Icon {...p} path={<><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></>} />;
const IX = (p) => <Icon {...p} path={<><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>} />;
const IPlus = (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></>} />;
const ICoffee = (p) => <Icon {...p} path={<><path d="M18 8h1a4 4 0 0 1 0 8h-1" /><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z" /><line x1="6" y1="1" x2="6" y2="4" /><line x1="10" y1="1" x2="10" y2="4" /><line x1="14" y1="1" x2="14" y2="4" /></>} />;
const ITrendUp = (p) => <Icon {...p} path={<><polyline points="23 6 13.5 15.5 8.5 10.5 1 18" /><polyline points="17 6 23 6 23 12" /></>} />;
const ITrendDown = (p) => <Icon {...p} path={<><polyline points="23 18 13.5 8.5 8.5 13.5 1 6" /><polyline points="17 18 23 18 23 12" /></>} />;
const IClipboard = (p) => <Icon {...p} path={<><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /><rect x="8" y="2" width="8" height="4" rx="1" ry="1" /></>} />;
const ISettings = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></>} />;
const ILoader = (p) => <Icon {...p} path={<line x1="12" y1="2" x2="12" y2="6" />} style={{ animation: "spin 1s linear infinite" }} />;

// ---------- simple charts (no external chart library) ----------
function DailyBarChart({ dias }) {
  const maxVal = Math.max(1, ...dias.map((d) => Math.max(toMin(d.extras70), toMin(d.extras100), toMin(d.faltas)) / 60));
  return (
    <div style={{ overflowX: "auto" }}>
      <div style={{ display: "flex", gap: 10, alignItems: "flex-end", minWidth: dias.length * 34, height: 180, padding: "8px 4px" }}>
        {dias.map((d, i) => {
          const e70 = toMin(d.extras70) / 60, e100 = toMin(d.extras100) / 60, falt = toMin(d.faltas) / 60;
          return (
            <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 3, width: 24 }} title={`${d.data} — ${d.situacao || ""}`}>
              <div style={{ display: "flex", gap: 2, alignItems: "flex-end", height: 130 }}>
                <div style={{ width: 6, background: PALETTE.amber, height: `${(e70 / maxVal) * 130}px`, borderRadius: "2px 2px 0 0" }} />
                <div style={{ width: 6, background: PALETTE.teal, height: `${(e100 / maxVal) * 130}px`, borderRadius: "2px 2px 0 0" }} />
                <div style={{ width: 6, background: PALETTE.stampRed, height: `${(falt / maxVal) * 130}px`, borderRadius: "2px 2px 0 0" }} />
              </div>
              <div className="mono" style={{ fontSize: 9, color: PALETTE.textSub, whiteSpace: "nowrap" }}>{d.data}</div>
            </div>
          );
        })}
      </div>
      <Legend items={[["Extras 70%", PALETTE.amber], ["Extras 100%", PALETTE.teal], ["Faltas", PALETTE.stampRed]]} />
    </div>
  );
}

function TrendChart({ history }) {
  let running = 0;
  const data = [...history].reverse().map((r) => {
    running += calcSaldo(r.totais);
    return {
      mes: r.periodo?.inicio?.slice(3) || "",
      e70: toMin(r.totais?.extras70) / 60,
      e100: toMin(r.totais?.extras100) / 60,
      falt: toMin(r.totais?.faltas) / 60,
      saldo: running / 60,
    };
  });
  const w = Math.max(320, data.length * 90), h = 190, padL = 34, padB = 22, padT = 10;
  const allVals = data.flatMap((d) => [d.e70, d.e100, d.falt, d.saldo]);
  const maxV = Math.max(1, ...allVals), minV = Math.min(0, ...allVals);
  const range = maxV - minV || 1;
  const xStep = data.length > 1 ? (w - padL - 10) / (data.length - 1) : 0;
  const xAt = (i) => padL + i * xStep;
  const yAt = (v) => padT + (h - padT - padB) * (1 - (v - minV) / range);
  const lineFor = (key) => data.map((d, i) => `${xAt(i)},${yAt(d[key])}`).join(" ");

  return (
    <div style={{ overflowX: "auto" }}>
      <svg width={w} height={h}>
        <line x1={padL} y1={yAt(0)} x2={w - 5} y2={yAt(0)} stroke={PALETTE.line} strokeDasharray="3 3" />
        {data.map((d, i) => (
          <text key={i} x={xAt(i)} y={h - 4} fontSize="10" fill={PALETTE.textSub} textAnchor="middle" fontFamily="IBM Plex Mono, monospace">{d.mes}</text>
        ))}
        <polyline points={lineFor("e70")} fill="none" stroke={PALETTE.amber} strokeWidth="2" />
        <polyline points={lineFor("e100")} fill="none" stroke={PALETTE.teal} strokeWidth="2" />
        <polyline points={lineFor("falt")} fill="none" stroke={PALETTE.stampRed} strokeWidth="2" />
        <polyline points={lineFor("saldo")} fill="none" stroke={PALETTE.ink} strokeWidth="2.5" strokeDasharray="4 2" />
        {data.map((d, i) => (
          <React.Fragment key={i}>
            <circle cx={xAt(i)} cy={yAt(d.e70)} r="3" fill={PALETTE.amber} />
            <circle cx={xAt(i)} cy={yAt(d.e100)} r="3" fill={PALETTE.teal} />
            <circle cx={xAt(i)} cy={yAt(d.falt)} r="3" fill={PALETTE.stampRed} />
            <circle cx={xAt(i)} cy={yAt(d.saldo)} r="3.5" fill={PALETTE.ink} />
          </React.Fragment>
        ))}
      </svg>
      <Legend items={[["Extras 70%", PALETTE.amber], ["Extras 100%", PALETTE.teal], ["Faltas", PALETTE.stampRed], ["Saldo acumulado", PALETTE.ink]]} />
    </div>
  );
}

function Legend({ items }) {
  return (
    <div style={{ display: "flex", gap: 14, flexWrap: "wrap", padding: "4px 8px 0", fontSize: 11, color: PALETTE.textSub }}>
      {items.map(([label, color]) => (
        <div key={label} style={{ display: "flex", alignItems: "center", gap: 5 }}>
          <span style={{ width: 9, height: 9, borderRadius: 2, background: color, display: "inline-block" }} />
          {label}
        </div>
      ))}
    </div>
  );
}

// ---------- main app ----------
function CartaoPontoTracker() {
  const [history, setHistory] = useState([]);
  const [ajustes, setAjustes] = useState([]);
  const [selectedKey, setSelectedKey] = useState(null);
  const [loading, setLoading] = useState(false);
  const [showAjusteForm, setShowAjusteForm] = useState(false);
  const [error, setError] = useState(null);
  const [apiKey, setApiKey] = useState("");
  const [showSettings, setShowSettings] = useState(false);
  const fileInputRef = useRef(null);

  useEffect(() => {
    const saved = localStorage.getItem(LS_API_KEY);
    if (saved) setApiKey(saved);
    else setShowSettings(true);
    loadHistory();
    loadAjustes();
  }, []);

  const loadAjustes = () => {
    const keys = storage.list("ajuste:");
    const entries = keys.map((k) => { try { return JSON.parse(storage.get(k)); } catch (e) { return null; } }).filter(Boolean);
    entries.sort((a, b) => parseBR(b.data) - parseBR(a.data));
    setAjustes(entries);
  };

  const loadHistory = () => {
    const keys = storage.list("cartao:");
    const records = keys.map((k) => { try { return JSON.parse(storage.get(k)); } catch (e) { return null; } }).filter(Boolean);
    records.sort((a, b) => parseBR(b?.periodo?.inicio) - parseBR(a?.periodo?.inicio));
    setHistory(records);
  };

  const handleSaveAjuste = (entry) => {
    const id = `${Date.now()}`;
    storage.set(ajusteKey(id), JSON.stringify({ id, ...entry }));
    loadAjustes();
    setShowAjusteForm(false);
  };

  const handleDeleteAjuste = (id) => {
    if (!window.confirm("Remover esse lançamento?")) return;
    storage.delete(ajusteKey(id));
    loadAjustes();
  };

  const handleSaveApiKey = (key) => {
    localStorage.setItem(LS_API_KEY, key);
    setApiKey(key);
    setShowSettings(false);
  };

  const handleFile = async (file) => {
    if (!file) return;
    if (!apiKey) { setShowSettings(true); return; }
    setError(null);
    setLoading(true);
    try {
      const base64 = await fileToBase64(file);
      const mediaType = file.type || "image/jpeg";
      const prompt = `Você está lendo a foto de um "Cartão Ponto" (folha de controle de horas de um funcionário brasileiro). Extraia os dados em JSON PURO, sem markdown, sem crases, sem texto antes ou depois. Use exatamente este formato:

{
  "periodo": {"inicio": "DD/MM/AAAA", "fim": "DD/MM/AAAA"},
  "funcionario": {"nome": "", "matricula": "", "cargo": ""},
  "dias": [
    {"data": "DD/MM", "sem": "SEG", "situacao": "texto da coluna Marcações/situação (ex: Horas Extras 70%, Faltas, DSR, Compensado, Trabalhando, ABONO)", "trabalho": "HH:MM ou vazio", "faltas": "HH:MM ou vazio", "extras70": "HH:MM ou vazio", "extras100": "HH:MM ou vazio"}
  ],
  "totais": {"trabalho": "HH:MM", "faltas": "HH:MM", "extras70": "HH:MM", "extras100": "HH:MM", "extrasNaoAut": "HH:MM"}
}

Preencha um objeto por dia da folha, na ordem em que aparecem. Se um campo não existir ou estiver vazio na linha, use "00:00". Copie os valores exatamente como aparecem na imagem, não calcule nada.`;

      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 4000,
          messages: [{ role: "user", content: [
            { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
            { type: "text", text: prompt },
          ] }],
        }),
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data?.error?.message || `Erro na API (${response.status})`);
      const textBlock = (data.content || []).find((b) => b.type === "text");
      if (!textBlock) throw new Error("Resposta sem texto");
      const clean = textBlock.text.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(clean);
      if (!parsed?.periodo?.inicio) throw new Error("Não consegui identificar o período do cartão");

      const record = { ...parsed, savedAt: new Date().toISOString() };
      const k = keyFromPeriodo(parsed.periodo);
      storage.set(k, JSON.stringify(record));
      loadHistory();
      setSelectedKey(k);
    } catch (e) {
      console.error(e);
      setError(e.message || "Não consegui ler esse cartão ponto. Tente uma foto mais nítida.");
    } finally {
      setLoading(false);
      if (fileInputRef.current) fileInputRef.current.value = "";
    }
  };

  const handleDelete = (record, e) => {
    e.stopPropagation();
    if (!window.confirm("Remover esse mês do histórico?")) return;
    storage.delete(keyFromPeriodo(record.periodo));
    if (selectedKey === keyFromPeriodo(record.periodo)) setSelectedKey(null);
    loadHistory();
  };

  const selected = history.find((r) => keyFromPeriodo(r.periodo) === selectedKey) || null;

  return (
    <div style={{ background: PALETTE.paper, minHeight: "100vh", color: PALETTE.textMain }}>
      <div style={{ background: PALETTE.ink, color: PALETTE.paper, paddingBottom: 14 }}>
        <div className="punch-row">
          {Array.from({ length: 22 }).map((_, i) => <div key={i} className="punch-hole" style={{ background: PALETTE.paper }} />)}
        </div>
        <div style={{ padding: "14px 20px 0", maxWidth: 900, margin: "0 auto", display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <div className="mono" style={{ fontSize: 11, letterSpacing: "0.12em", opacity: 0.7 }}>CONTROLE DE PONTO — HISTÓRICO PESSOAL</div>
            <h1 style={{ margin: "4px 0 2px", fontSize: 24, fontWeight: 700 }}>Cartão Ponto</h1>
            <div style={{ fontSize: 13, opacity: 0.75 }}>Envie a foto do cartão todo mês e acompanhe extras e faltas ao longo do tempo.</div>
          </div>
          <button onClick={() => setShowSettings(true)} style={{ background: "none", border: "1px solid rgba(255,255,255,0.3)", color: PALETTE.paper, borderRadius: 6, padding: 8, cursor: "pointer", flexShrink: 0 }} title="Configurar chave de API" aria-label="Configurações">
            <ISettings size={17} />
          </button>
        </div>
      </div>

      <div style={{ maxWidth: 900, margin: "0 auto", padding: "20px 16px 60px" }}>

        {showSettings && (
          <SettingsPanel currentKey={apiKey} onSave={handleSaveApiKey} onClose={() => apiKey && setShowSettings(false)} />
        )}

        {!showSettings && !selected && (
          <>
            {(history.length > 0 || ajustes.length > 0) && (
              <BancoHorasCard history={history} ajustes={ajustes} showForm={showAjusteForm}
                onToggleForm={() => setShowAjusteForm((v) => !v)} onSaveAjuste={handleSaveAjuste} onCancelForm={() => setShowAjusteForm(false)} />
            )}

            {ajustes.length > 0 && <AjustesList ajustes={ajustes} onDelete={handleDeleteAjuste} />}

            <div className="card" style={{ padding: 20, marginBottom: 20, borderStyle: "dashed", borderWidth: 2, textAlign: "center" }}>
              <input ref={fileInputRef} type="file" accept="image/*" style={{ display: "none" }} onChange={(e) => handleFile(e.target.files?.[0])} />
              {loading ? (
                <div style={{ padding: "16px 0", display: "flex", flexDirection: "column", alignItems: "center", gap: 10, color: PALETTE.textSub }}>
                  <ILoader size={26} />
                  <div>Lendo o cartão…</div>
                </div>
              ) : (
                <>
                  <IUpload size={26} color={PALETTE.textSub} style={{ marginBottom: 8 }} />
                  <div style={{ fontWeight: 600, marginBottom: 4 }}>Inserir cartão do mês</div>
                  <div style={{ fontSize: 12.5, color: PALETTE.textSub, marginBottom: 14 }}>Foto do cartão ponto (JPG ou PNG)</div>
                  <button className="btn-primary" onClick={() => fileInputRef.current?.click()}><IUpload size={16} /> Escolher foto</button>
                </>
              )}
            </div>

            {error && (
              <div style={{ display: "flex", gap: 8, alignItems: "flex-start", background: "#F7E9E6", border: `1px solid ${PALETTE.stampRed}`, color: PALETTE.stampRed, borderRadius: 6, padding: "10px 12px", marginBottom: 20, fontSize: 13 }}>
                <IAlert size={16} style={{ flexShrink: 0, marginTop: 1 }} />
                <div style={{ flex: 1 }}>{error}</div>
                <IX size={16} style={{ cursor: "pointer", flexShrink: 0 }} onClick={() => setError(null)} />
              </div>
            )}

            {history.length >= 2 && (
              <div className="card" style={{ padding: "16px 12px 8px", marginBottom: 20 }}>
                <div className="mono" style={{ fontSize: 11, letterSpacing: "0.1em", color: PALETTE.textSub, padding: "0 8px 8px" }}>TENDÊNCIA ENTRE MESES (horas)</div>
                <TrendChart history={history} />
              </div>
            )}

            <div style={{ marginTop: 24 }}>
              <div className="mono" style={{ fontSize: 11, letterSpacing: "0.1em", color: PALETTE.textSub, marginBottom: 10 }}>MESES REGISTRADOS</div>
              {history.length === 0 ? (
                <div className="card" style={{ padding: 20, textAlign: "center", color: PALETTE.textSub, fontSize: 13 }}>
                  <IClipboard size={20} style={{ marginBottom: 6 }} />
                  <div>Nenhum cartão salvo ainda. Envie a foto do primeiro mês acima.</div>
                </div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {history.map((r) => (
                    <MonthCard key={keyFromPeriodo(r.periodo)} record={r} onClick={() => setSelectedKey(keyFromPeriodo(r.periodo))} onDelete={(e) => handleDelete(r, e)} />
                  ))}
                </div>
              )}
            </div>
          </>
        )}

        {!showSettings && selected && <MonthDetail record={selected} onBack={() => setSelectedKey(null)} />}
      </div>
    </div>
  );
}

function SettingsPanel({ currentKey, onSave, onClose }) {
  const [value, setValue] = useState(currentKey || "");
  return (
    <div className="card" style={{ padding: 20, marginBottom: 20 }}>
      <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 6 }}>Chave da API da Anthropic</div>
      <div style={{ fontSize: 12.5, color: PALETTE.textSub, marginBottom: 12 }}>
        Necessária pra ler a foto do cartão ponto. Fica salva só neste navegador (localStorage) — nunca é enviada a nenhum servidor além da própria Anthropic.
        Pegue a sua em <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com/settings/keys</a>.
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <input type="password" value={value} onChange={(e) => setValue(e.target.value)} placeholder="sk-ant-..."
          style={{ flex: "1 1 260px", border: `1px solid ${PALETTE.line}`, borderRadius: 5, padding: "9px 10px", fontSize: 13 }} />
        <button className="btn-primary" onClick={() => value.trim() && onSave(value.trim())}>Salvar</button>
        {currentKey && <button onClick={onClose} style={{ background: "none", border: `1px solid ${PALETTE.line}`, borderRadius: 5, padding: "9px 16px", fontSize: 13, cursor: "pointer", color: PALETTE.textSub }}>Cancelar</button>}
      </div>
    </div>
  );
}

function StatusColor(situacao = "") {
  const s = situacao.toLowerCase();
  if (s.includes("falta")) return PALETTE.stampRed;
  if (s.includes("extra")) return PALETTE.amber;
  if (s.includes("dsr") || s.includes("compensado")) return PALETTE.textSub;
  return PALETTE.teal;
}

function MonthCard({ record, onClick, onDelete }) {
  const t = record.totais || {};
  const saldoMes = calcSaldo(t);
  return (
    <div className="card" onClick={onClick} style={{ padding: "14px 16px", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12 }}>
      <div>
        <div style={{ fontWeight: 700, fontSize: 14.5 }}>{record.periodo?.inicio} – {record.periodo?.fim}</div>
        <div style={{ fontSize: 12, color: PALETTE.textSub, marginTop: 2 }}>{record.funcionario?.nome}</div>
        <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
          <span className="stamp" style={{ color: PALETTE.ink }}>TRAB {t.trabalho || "0:00"}</span>
          <span className="stamp" style={{ color: PALETTE.amber }}>+70% {t.extras70 || "0:00"}</span>
          {toMin(t.extras100) > 0 && <span className="stamp" style={{ color: PALETTE.teal }}>+100% {t.extras100 || "0:00"}</span>}
          {toMin(t.faltas) > 0 && <span className="stamp" style={{ color: PALETTE.stampRed }}>FALTAS {t.faltas}</span>}
          <span className="stamp" style={{ color: saldoMes >= 0 ? PALETTE.green : PALETTE.stampRed }}>SALDO {saldoMes >= 0 ? "+" : ""}{toHHMM(saldoMes)}</span>
        </div>
      </div>
      <ITrash size={17} color={PALETTE.textSub} onClick={onDelete} style={{ flexShrink: 0, cursor: "pointer" }} />
    </div>
  );
}

function BancoHorasCard({ history, ajustes, showForm, onToggleForm, onSaveAjuste, onCancelForm }) {
  const extrasTotais = history.reduce((acc, r) => acc + toMin(r.totais?.extras70) + toMin(r.totais?.extras100), 0);
  const faltasTotais = history.reduce((acc, r) => acc + toMin(r.totais?.faltas), 0);
  const ajustesMin = ajustes.reduce((acc, a) => acc + (a.minutos || 0), 0);
  const saldoTotal = extrasTotais - faltasTotais + ajustesMin;
  const positivo = saldoTotal >= 0;
  const creditos = extrasTotais + ajustes.filter((a) => a.minutos > 0).reduce((s, a) => s + a.minutos, 0);
  const debitos = faltasTotais + ajustes.filter((a) => a.minutos < 0).reduce((s, a) => s - a.minutos, 0);
  const totalAbs = creditos + debitos || 1;
  const pctCredito = Math.round((creditos / totalAbs) * 100);

  return (
    <div className="card" style={{ marginBottom: 16, overflow: "hidden" }}>
      <div style={{ background: PALETTE.ink, color: PALETTE.paper, padding: "18px 20px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12, flexWrap: "wrap" }}>
          <div>
            <div className="mono" style={{ fontSize: 10.5, letterSpacing: "0.14em", opacity: 0.65 }}>BANCO DE HORAS</div>
            <div className="mono" style={{ fontSize: 36, fontWeight: 700, lineHeight: 1.15, marginTop: 4, color: positivo ? "#8FD9A0" : "#F0A89C" }}>
              {positivo ? "+" : "−"}{toHHMM(Math.abs(saldoTotal)).replace("-", "")}
            </div>
            <div style={{ fontSize: 12, opacity: 0.7, marginTop: 2 }}>saldo acumulado · ≈{(Math.abs(saldoTotal) / 60).toFixed(1)}h</div>
          </div>
          <button onClick={onToggleForm} style={{ background: showForm ? "rgba(255,255,255,0.16)" : PALETTE.paper, color: showForm ? "#fff" : PALETTE.ink, border: "none", borderRadius: 6, padding: "9px 14px", fontWeight: 600, fontSize: 12.5, cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 6, whiteSpace: "nowrap" }}>
            <IPlus size={15} /> Lançar folga / ajuste
          </button>
        </div>
        <div style={{ marginTop: 16 }}>
          <div style={{ display: "flex", height: 8, borderRadius: 5, overflow: "hidden", background: "rgba(255,255,255,0.15)" }}>
            <div style={{ width: `${pctCredito}%`, background: PALETTE.green }} />
            <div style={{ width: `${100 - pctCredito}%`, background: PALETTE.stampRed }} />
          </div>
        </div>
        <div style={{ display: "flex", gap: 20, marginTop: 14, flexWrap: "wrap" }}>
          <Stat icon={<ITrendUp size={14} />} label="Extras" value={`+${toHHMM(extrasTotais)}`} color="#8FD9A0" />
          <Stat icon={<ITrendDown size={14} />} label="Faltas" value={faltasTotais > 0 ? `−${toHHMM(faltasTotais)}` : "0:00"} color="#F0A89C" />
          <Stat icon={<ICoffee size={14} />} label="Folgas/ajustes" value={`${ajustesMin >= 0 ? "+" : "−"}${toHHMM(Math.abs(ajustesMin))}`} color="#D9C88F" />
        </div>
      </div>
      {showForm && <AjusteForm onSave={onSaveAjuste} onCancel={onCancelForm} />}
    </div>
  );
}

function Stat({ icon, label, value, color }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
      <span style={{ color }}>{icon}</span>
      <span className="mono" style={{ fontSize: 13.5, fontWeight: 600, color }}>{value}</span>
      <span style={{ fontSize: 11, opacity: 0.65 }}>{label}</span>
    </div>
  );
}

function AjusteForm({ onSave, onCancel }) {
  const todayISO = new Date().toISOString().slice(0, 10);
  const [tipo, setTipo] = useState("folga");
  const [dataISO, setDataISO] = useState(todayISO);
  const [horas, setHoras] = useState("");
  const [descricao, setDescricao] = useState("");
  const [formError, setFormError] = useState(null);

  const submit = () => {
    if (!/^\d{1,3}:\d{2}$/.test(horas.trim())) { setFormError("Informe as horas no formato HH:MM (ex: 08:00)"); return; }
    const [y, m, d] = dataISO.split("-");
    const dataBR = `${d}/${m}/${y}`;
    const minutos = tipo === "folga" ? -toMin(horas) : toMin(horas);
    onSave({ data: dataBR, tipo, horas: horas.trim(), descricao: descricao.trim(), minutos });
  };

  return (
    <div style={{ padding: 16, background: "#FAF8F3", borderTop: `1px solid ${PALETTE.line}` }}>
      <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
        <TypeButton active={tipo === "folga"} onClick={() => setTipo("folga")} label="Folga (desconta)" color={PALETTE.stampRed} />
        <TypeButton active={tipo === "credito"} onClick={() => setTipo("credito")} label="Ajuste a crédito" color={PALETTE.green} />
      </div>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 10 }}>
        <Field label="Data"><input type="date" value={dataISO} onChange={(e) => setDataISO(e.target.value)} style={inputStyle} /></Field>
        <Field label="Horas (HH:MM)"><input type="text" placeholder="08:00" value={horas} onChange={(e) => setHoras(e.target.value)} style={{ ...inputStyle, width: 90 }} /></Field>
        <Field label="Descrição (opcional)" grow><input type="text" placeholder="ex: folga médica, banco de horas..." value={descricao} onChange={(e) => setDescricao(e.target.value)} style={{ ...inputStyle, width: "100%" }} /></Field>
      </div>
      {formError && <div style={{ color: PALETTE.stampRed, fontSize: 12, marginBottom: 8 }}>{formError}</div>}
      <div style={{ display: "flex", gap: 8 }}>
        <button className="btn-primary" style={{ padding: "8px 16px", fontSize: 13 }} onClick={submit}>Salvar</button>
        <button onClick={onCancel} style={{ background: "none", border: `1px solid ${PALETTE.line}`, borderRadius: 5, padding: "8px 16px", fontSize: 13, cursor: "pointer", color: PALETTE.textSub }}>Cancelar</button>
      </div>
    </div>
  );
}

const inputStyle = { border: `1px solid ${PALETTE.line}`, borderRadius: 5, padding: "7px 9px", fontSize: 13, fontFamily: "'IBM Plex Sans', sans-serif", background: "#fff", color: PALETTE.textMain };

function Field({ label, children, grow }) {
  return (
    <div style={{ flex: grow ? "1 1 220px" : "0 0 auto" }}>
      <div style={{ fontSize: 10.5, color: PALETTE.textSub, marginBottom: 3, textTransform: "uppercase", letterSpacing: "0.05em" }}>{label}</div>
      {children}
    </div>
  );
}

function TypeButton({ active, onClick, label, color }) {
  return (
    <button onClick={onClick} style={{ border: `1.5px solid ${active ? color : PALETTE.line}`, background: active ? color : "#fff", color: active ? "#fff" : PALETTE.textMain, borderRadius: 5, padding: "7px 12px", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
      {label}
    </button>
  );
}

function AjustesList({ ajustes, onDelete }) {
  return (
    <div style={{ marginBottom: 20 }}>
      <div className="mono" style={{ fontSize: 11, letterSpacing: "0.1em", color: PALETTE.textSub, marginBottom: 8 }}>FOLGAS E AJUSTES LANÇADOS</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {ajustes.map((a) => (
          <div key={a.id} className="card" style={{ padding: "9px 14px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
              <span className="stamp" style={{ color: a.tipo === "folga" ? PALETTE.stampRed : PALETTE.green }}>
                {a.tipo === "folga" ? "FOLGA" : "AJUSTE"} {a.minutos >= 0 ? "+" : "−"}{toHHMM(Math.abs(a.minutos))}
              </span>
              <span style={{ fontSize: 12.5, color: PALETTE.textSub, whiteSpace: "nowrap" }}>{a.data}</span>
              {a.descricao && <span style={{ fontSize: 12.5, color: PALETTE.textMain, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{a.descricao}</span>}
            </div>
            <ITrash size={15} color={PALETTE.textSub} style={{ cursor: "pointer", flexShrink: 0 }} onClick={() => onDelete(a.id)} />
          </div>
        ))}
      </div>
    </div>
  );
}

function MonthDetail({ record, onBack }) {
  const dias = record.dias || [];
  const t = record.totais || {};
  const saldoDoMes = calcSaldo(t);

  return (
    <div>
      <button onClick={onBack} style={{ background: "none", border: "none", display: "flex", alignItems: "center", gap: 4, color: PALETTE.textSub, fontSize: 13, cursor: "pointer", padding: 0, marginBottom: 14 }}>
        <IChevronLeft size={16} /> Voltar ao histórico
      </button>

      <div className="card" style={{ padding: 16, marginBottom: 16 }}>
        <div style={{ fontWeight: 700, fontSize: 16 }}>{record.periodo?.inicio} – {record.periodo?.fim}</div>
        <div style={{ fontSize: 13, color: PALETTE.textSub, marginTop: 2 }}>{record.funcionario?.nome} {record.funcionario?.cargo ? `· ${record.funcionario.cargo}` : ""}</div>
        <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
          <span className="stamp" style={{ color: PALETTE.ink }}>TRABALHO {t.trabalho || "0:00"}</span>
          <span className="stamp" style={{ color: PALETTE.amber }}>EXTRAS 70% {t.extras70 || "0:00"}</span>
          <span className="stamp" style={{ color: PALETTE.teal }}>EXTRAS 100% {t.extras100 || "0:00"}</span>
          <span className="stamp" style={{ color: PALETTE.stampRed }}>FALTAS {t.faltas || "0:00"}</span>
          <span className="stamp" style={{ color: saldoDoMes >= 0 ? PALETTE.green : PALETTE.stampRed }}>SALDO DO MÊS {saldoDoMes >= 0 ? "+" : ""}{toHHMM(saldoDoMes)}</span>
        </div>
      </div>

      <div className="card" style={{ padding: "16px 12px 8px", marginBottom: 16 }}>
        <div className="mono" style={{ fontSize: 11, letterSpacing: "0.1em", color: PALETTE.textSub, padding: "0 8px 8px" }}>HORAS EXTRAS E FALTAS POR DIA</div>
        <DailyBarChart dias={dias} />
      </div>

      <div className="mono" style={{ fontSize: 11, letterSpacing: "0.1em", color: PALETTE.textSub, marginBottom: 8 }}>LANÇAMENTOS DIÁRIOS</div>
      <div className="scrollbox">
        <table className="ledger">
          <thead><tr><th>Data</th><th>Sem</th><th>Situação</th><th>Trab.</th><th>Extra 70%</th><th>Extra 100%</th><th>Faltas</th></tr></thead>
          <tbody>
            {dias.map((d, i) => (
              <tr key={i}>
                <td>{d.data}</td>
                <td>{d.sem}</td>
                <td style={{ color: StatusColor(d.situacao) }}>{d.situacao}</td>
                <td>{toMin(d.trabalho) > 0 ? d.trabalho : "—"}</td>
                <td>{toMin(d.extras70) > 0 ? d.extras70 : "—"}</td>
                <td>{toMin(d.extras100) > 0 ? d.extras100 : "—"}</td>
                <td>{toMin(d.faltas) > 0 ? d.faltas : "—"}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<CartaoPontoTracker />);
</script>
<script>
  var srcCode = document.getElementById('app-source').textContent;
  var output = Babel.transform(srcCode, { presets: [['react', { runtime: 'classic' }]] }).code;
  var runScript = document.createElement('script');
  runScript.text = output;
  document.body.appendChild(runScript);
</script>
</body>
</html>
